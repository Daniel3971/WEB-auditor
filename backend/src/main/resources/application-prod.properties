server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
app.security.secure-cookie=true
app.security.cookie-same-site=None
app.security.frontend-origin=${FRONTEND_ORIGIN}
app.storage.cv-directory=${CV_UPLOAD_DIR}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.open-in-view=false
app.security.turnstile.enabled=${TURNSTILE_ENABLED:true}
app.security.turnstile.site-key=${TURNSTILE_SITE_KEY}
app.security.turnstile.secret-key=${TURNSTILE_SECRET_KEY}
