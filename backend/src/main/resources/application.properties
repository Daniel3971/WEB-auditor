spring.application.name=backend

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.security.secure-cookie=false
app.security.frontend-origin=http://localhost:4200
app.storage.cv-directory=uploads/cvs
app.security.login.max-attempts=5
app.security.login.lock-minutes=15
app.security.application.max-attempts=10
app.security.application.window-minutes=60
app.security.turnstile.enabled=false
app.security.turnstile.site-key=
app.security.turnstile.secret-key=

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
