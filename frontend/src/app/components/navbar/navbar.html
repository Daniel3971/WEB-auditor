<header class="header">
  <div class="brand">
    <a routerLink="/">
      <img
        src="/logo_Atwi.png"
        alt="ATWI Audit & Accounting Logo"
        class="header-logo"
      >
    </a>
  </div>

  <nav id="main-navigation" class="navbar" [class.is-open]="menuOpen()">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMenu()"
    >
      {{ 'NAV.HOME' | translate }}
    </a>

    <a routerLink="/about" routerLinkActive="active" (click)="closeMenu()">
      {{ 'NAV.ABOUT' | translate }}
    </a>

    <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()">
      {{ 'NAV.SERVICES' | translate }}
    </a>

    <a routerLink="/locations" routerLinkActive="active" (click)="closeMenu()">
      {{ 'NAV.LOCATIONS' | translate }}
    </a>

    <a routerLink="/official-forms" routerLinkActive="active" (click)="closeMenu()">
      {{ 'NAV.OFFICIAL_FORMS' | translate }}
    </a>

    <a routerLink="/careers" routerLinkActive="active" (click)="closeMenu()">
      {{ 'NAV.CAREERS' | translate }}
    </a>
  </nav>

  <button
    type="button"
    class="menu-toggle"
    [class.is-open]="menuOpen()"
    [attr.aria-expanded]="menuOpen()"
    aria-controls="main-navigation"
    [attr.aria-label]="(menuOpen() ? 'NAV.CLOSE_MENU' : 'NAV.OPEN_MENU') | translate"
    (click)="toggleMenu()"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div
    class="language-switcher"
    aria-label="Language selector"
  >
    <button
      type="button"
      [class.active]="language.currentLanguage === 'en'"
      (click)="language.changeLanguage('en')"
      [attr.aria-pressed]="language.currentLanguage === 'en'"
    >
      EN
    </button>

    <button
      type="button"
      [class.active]="language.currentLanguage === 'ar'"
      (click)="language.changeLanguage('ar')"
      [attr.aria-pressed]="language.currentLanguage === 'ar'"
    >
      AR
    </button>
  </div>
</header>
